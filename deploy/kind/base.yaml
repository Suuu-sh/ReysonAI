apiVersion: v1
kind: Namespace
metadata:
  name: solveaai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: solveaai-runtime
  namespace: solveaai
data:
  SOLVEAAI_API_BIND: 0.0.0.0:3000
  SOLVEAAI_ENABLE_GENERATION: "true"
  SOLVEAAI_CONFIG_PATH: /etc/solveaai/cash-6max-100bb.json
  SOLVEAAI_SOLUTION_ID: cash-6max-100bb-v1
  SOLVEAAI_SOLUTION_DIR: /var/lib/solveaai/solutions
  SOLVEAAI_QUEUE_DIR: /var/lib/solveaai/jobs
  SOLVEAAI_QUEUE_BACKEND: redis
  SOLVEAAI_REDIS_URL: redis://solveaai-redis:6379/
  SOLVEAAI_REDIS_PREFIX: solveaai
  SOLVEAAI_REDIS_GROUP: solveaai-workers
  SOLVEAAI_REDIS_BLOCK_MS: "1000"
  SOLVEAAI_REDIS_LEASE_MS: "60000"
---
apiVersion: v1
kind: Service
metadata:
  name: solveaai-redis
  namespace: solveaai
spec:
  selector:
    app: solveaai-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveaai-redis
  namespace: solveaai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: solveaai-redis
  template:
    metadata:
      labels:
        app: solveaai-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          hostPath:
            path: /var/lib/solveaai/redis
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: solveaai-api
  namespace: solveaai
spec:
  selector:
    app: solveaai-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveaai-api
  namespace: solveaai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveaai-api
  template:
    metadata:
      labels:
        app: solveaai-api
    spec:
      containers:
        - name: api
          image: solveaai-api:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: solveaai-runtime
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: solveaai-data
              mountPath: /var/lib/solveaai
            - name: solveaai-config
              mountPath: /etc/solveaai
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: solveaai-data
          hostPath:
            path: /var/lib/solveaai
            type: Directory
        - name: solveaai-config
          configMap:
            name: solveaai-game-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveaai-worker
  namespace: solveaai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveaai-worker
  template:
    metadata:
      labels:
        app: solveaai-worker
    spec:
      containers:
        - name: worker
          image: solveaai-worker:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/app"]
          args: ["worker", "/var/lib/solveaai/jobs", "--poll-ms", "1000"]
          envFrom:
            - configMapRef:
                name: solveaai-runtime
          volumeMounts:
            - name: solveaai-data
              mountPath: /var/lib/solveaai
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: solveaai-data
          hostPath:
            path: /var/lib/solveaai
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: solveaai-ui
  namespace: solveaai
spec:
  type: NodePort
  selector:
    app: solveaai-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveaai-ui
  namespace: solveaai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveaai-ui
  template:
    metadata:
      labels:
        app: solveaai-ui
    spec:
      containers:
        - name: ui
          image: solveaai-ui:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
