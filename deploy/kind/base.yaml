apiVersion: v1
kind: Namespace
metadata:
  name: solveagto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: solveagto-runtime
  namespace: solveagto
data:
  SOLVEAGTO_API_BIND: 0.0.0.0:3000
  SOLVEAGTO_SOLUTION_DIR: /var/lib/solveagto/solutions
  SOLVEAGTO_QUEUE_DIR: /var/lib/solveagto/jobs
---
apiVersion: v1
kind: Service
metadata:
  name: solveagto-api
  namespace: solveagto
spec:
  selector:
    app: solveagto-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-api
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-api
  template:
    metadata:
      labels:
        app: solveagto-api
    spec:
      containers:
        - name: api
          image: solveagto-api:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: solveagto-runtime
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: solveagto-data
              mountPath: /var/lib/solveagto
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: solveagto-data
          hostPath:
            path: /var/lib/solveagto
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-worker
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-worker
  template:
    metadata:
      labels:
        app: solveagto-worker
    spec:
      containers:
        - name: worker
          image: solveagto-worker:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/app"]
          args: ["worker", "/var/lib/solveagto/jobs", "--poll-ms", "1000"]
          envFrom:
            - configMapRef:
                name: solveagto-runtime
          volumeMounts:
            - name: solveagto-data
              mountPath: /var/lib/solveagto
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: solveagto-data
          hostPath:
            path: /var/lib/solveagto
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: solveagto-ui
  namespace: solveagto
spec:
  type: NodePort
  selector:
    app: solveagto-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-ui
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-ui
  template:
    metadata:
      labels:
        app: solveagto-ui
    spec:
      containers:
        - name: ui
          image: solveagto-ui:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
