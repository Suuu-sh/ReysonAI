apiVersion: v1
kind: Namespace
metadata:
  name: solveagto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: solveagto-runtime
  namespace: solveagto
data:
  SOLVEAGTO_API_BIND: 0.0.0.0:3000
  SOLVEAGTO_ENABLE_GENERATION: "true"
  SOLVEAGTO_CONFIG_PATH: /etc/solveagto/cash-6max-100bb.json
  SOLVEAGTO_SOLUTION_ID: cash-6max-100bb-v1
  SOLVEAGTO_SOLUTION_DIR: /var/lib/solveagto/solutions
  SOLVEAGTO_QUEUE_DIR: /var/lib/solveagto/jobs
  SOLVEAGTO_QUEUE_BACKEND: redis
  SOLVEAGTO_REDIS_URL: redis://solveagto-redis:6379/
  SOLVEAGTO_REDIS_PREFIX: solveagto
  SOLVEAGTO_REDIS_GROUP: solveagto-workers
  SOLVEAGTO_REDIS_BLOCK_MS: "1000"
  SOLVEAGTO_REDIS_LEASE_MS: "60000"
---
apiVersion: v1
kind: Service
metadata:
  name: solveagto-redis
  namespace: solveagto
spec:
  selector:
    app: solveagto-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-redis
  namespace: solveagto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: solveagto-redis
  template:
    metadata:
      labels:
        app: solveagto-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          hostPath:
            path: /var/lib/solveagto/redis
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: solveagto-api
  namespace: solveagto
spec:
  selector:
    app: solveagto-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-api
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-api
  template:
    metadata:
      labels:
        app: solveagto-api
    spec:
      containers:
        - name: api
          image: solveagto-api:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: solveagto-runtime
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: solveagto-data
              mountPath: /var/lib/solveagto
            - name: solveagto-config
              mountPath: /etc/solveagto
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: solveagto-data
          hostPath:
            path: /var/lib/solveagto
            type: Directory
        - name: solveagto-config
          configMap:
            name: solveagto-game-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-worker
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-worker
  template:
    metadata:
      labels:
        app: solveagto-worker
    spec:
      containers:
        - name: worker
          image: solveagto-worker:local
          imagePullPolicy: Never
          command: ["/usr/local/bin/app"]
          args: ["worker", "/var/lib/solveagto/jobs", "--poll-ms", "1000"]
          envFrom:
            - configMapRef:
                name: solveagto-runtime
          volumeMounts:
            - name: solveagto-data
              mountPath: /var/lib/solveagto
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: solveagto-data
          hostPath:
            path: /var/lib/solveagto
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: solveagto-ui
  namespace: solveagto
spec:
  type: NodePort
  selector:
    app: solveagto-ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solveagto-ui
  namespace: solveagto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solveagto-ui
  template:
    metadata:
      labels:
        app: solveagto-ui
    spec:
      containers:
        - name: ui
          image: solveagto-ui:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
