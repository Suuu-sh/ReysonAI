apiVersion: batch/v1
kind: Job
metadata:
  name: solveagto-precompute
  namespace: solveagto
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: solveagto-precompute
    spec:
      restartPolicy: Never
      containers:
        - name: precompute
          image: solveagto-worker:local
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              solution_path=/var/lib/solveagto/solutions/cash-6max-100bb-v1.json
              if [ -s "$solution_path" ]; then
                echo "Solution already exists; skip precompute: $solution_path"
                exit 0
              fi
              exec /usr/local/bin/app solve \
                /etc/solveagto/cash-6max-100bb.json \
                /var/lib/solveagto/solutions
          volumeMounts:
            - name: solveagto-data
              mountPath: /var/lib/solveagto
            - name: solveagto-config
              mountPath: /etc/solveagto
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: solveagto-data
          hostPath:
            path: /var/lib/solveagto
            type: Directory
        - name: solveagto-config
          configMap:
            name: solveagto-game-config
