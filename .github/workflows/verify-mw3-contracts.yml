name: Verify three-player postflop contracts
on:
  pull_request:
    branches: [development, main]
    paths:
      - 'apps/frontend/scripts/postflop-ai/mw3-*.mjs'
      - 'apps/frontend/scripts/postflop-ai/gate-mw3-pilot.mjs'
      - 'apps/frontend/scripts/postflop-ai/materialize-mw3-pilot.mjs'
      - 'apps/frontend/scripts/postflop-ai/materialize-mw3-authored.mjs'
      - 'apps/frontend/scripts/postflop-ai/gate-mw3-authored.mjs'
      - 'apps/frontend/scripts/data/mw3-authored/**'
      - 'apps/shared/mw3-approved.ts'
      - 'apps/frontend/scripts/postflop-ai/model.mjs'
      - 'apps/frontend/scripts/data/mw3-*.mjs'
      - 'apps/frontend/scripts/lib/continuation-evaluator.mjs'
      - 'apps/frontend/scripts/lib/equity.mjs'
      - 'apps/frontend/src/estimated/**'
      - 'apps/frontend/src/agent/**'
      - 'apps/frontend/tests/mw3-consumer-*.test.mjs'
      - 'apps/frontend/tests/mw3-local-d1.test.mjs'
      - 'apps/frontend/scripts/verify-mw3-local-d1.mjs'
      - 'apps/frontend/tests/helpers/mw3-consumer-fixture.mjs'
      - 'apps/frontend/tests/postflop-mw3-*.test.mjs'
      - 'apps/backend/src/mw3-*.ts'
      - 'apps/backend/src/index.ts'
      - 'apps/backend/scripts/sql/mw3-schema.sql'
      - 'apps/backend/tests/mw3-*.test.mjs'
      - 'configs/cash-6max-100bb.json'
      - '.github/workflows/verify-mw3-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=256
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install pinned frontend test dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Restore exact reviewed preflop fixtures for Agent bootstrap
        working-directory: apps/frontend
        run: node scripts/restore-reviewed-preflop.mjs
      - name: Check offline command syntax without executing generation
        run: |
          node --check apps/frontend/scripts/postflop-ai/gate-mw3-pilot.mjs
          node --check apps/frontend/scripts/postflop-ai/materialize-mw3-pilot.mjs
          node --check apps/frontend/scripts/postflop-ai/materialize-mw3-authored.mjs
          node --check apps/frontend/scripts/postflop-ai/gate-mw3-authored.mjs
          node --check apps/frontend/scripts/postflop-ai/mw3-snapshot-cli.mjs
          node --check apps/frontend/scripts/verify-mw3-local-d1.mjs
      - name: Test isolated three-player engine, classifier, codecs and adapters
        run: node --test --test-concurrency=1 apps/frontend/tests/postflop-mw3-*.test.mjs apps/frontend/tests/mw3-consumer-*.test.mjs apps/frontend/tests/mw3-local-d1.test.mjs
      - name: Test unpublished, fail-closed three-player delivery boundary
        run: node --experimental-strip-types --test apps/backend/tests/mw3-*.test.mjs
      # This workflow never compiles/authors saved candidates, runs the pilot gate,
      # uploads artifacts, edits receipts, imports D1 or deploys the product.
