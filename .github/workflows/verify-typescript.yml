name: Verify TypeScript source migration

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'docs/qa/**'
      - 'tsconfig.tooling.json'
      - '.github/workflows/verify-typescript.yml'
  push:
    branches: [development]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'types/**'
      - 'docs/qa/**'
      - 'tsconfig.tooling.json'
      - '.github/workflows/verify-typescript.yml'

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/mcp/package-lock.json
      - run: npm --prefix apps/frontend ci --ignore-scripts
      - run: npm --prefix apps/mcp ci --ignore-scripts
      - run: npm --prefix apps/frontend run typecheck:repository
      - run: node --test scripts/ci/typescript-sources.test.ts
