name: Verify reviewed data and deploy ReysonAI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/src/**'
      - 'apps/frontend/public/**'
      - 'apps/frontend/scripts/**'
      - 'apps/frontend/worker/**'
      - 'apps/frontend/.openai/hosting.json'
      - 'apps/frontend/.env.production'
      - 'apps/frontend/.npmrc'
      - 'apps/frontend/index.html'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - 'apps/frontend/vite.config.*'
      - 'apps/frontend/tsconfig*.json'
      - 'apps/frontend/wrangler.jsonc'
      - 'apps/frontend/tests/**'
      - 'apps/backend/migrations/0003_preflop.sql'
      - 'apps/backend/wrangler.jsonc'
      - 'apps/backend/src/**'
      - 'apps/backend/tests/**'
      - 'apps/backend/package.json'
      - 'apps/backend/migrations/0009_ranked.sql'
      - 'apps/backend/migrations/0010_fastfold.sql'
      - 'apps/backend/migrations/0011_human_ranked.sql'
      - 'apps/backend/migrations/0012_postflop_profile_policies.sql'
      - 'apps/backend/scripts/**'
      - 'apps/shared/**'
      - 'configs/**'
      - 'artifacts/preflop/**'
      - 'artifacts/postflop/mw3-*'
      - 'apps/backend/scripts/sql/mw3-schema.sql'
      - '.gitattributes'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches:
      - development
      - main
      - codex/fix/pr44_frozen_loading/01a11189
  workflow_dispatch:

permissions:
  contents: read

# Keep the running deployment intact; only the newest pending run is retained.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('reysonai-preflop-pr-{0}', github.event.pull_request.number) || 'reysonai-frontend-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify reviewed preflop snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/frontend
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # MW3 saved provenance verifies historical source trees.
          persist-credentials: false
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore exact reviewed Git LFS payload
        run: |
          node scripts/restore-reviewed-preflop.mjs
          node scripts/restore-reviewed-stage3.mjs

      - name: Verify immutable MW3 production contract and exact accepted SQL
        run: |
          node --test tests/mw3-production-delivery.test.mjs
          node scripts/mw3-production-delivery.mjs verify

      # Authoring and independent AI review happen locally, before commit.
      # CI must never generate strategies or update the review receipt.
      - name: Verify reviewed artifact and source hashes; serialize preflop only
        run: node scripts/verify-reviewed-preflop.mjs --out .local/reviewed-preflop

      - name: Check continuation invariants and unchanged HU inputs
        run: node --test --test-force-exit --test-concurrency=1 tests/continuation-*.test.mjs tests/stage3-*.test.mjs tests/reviewed-preflop.test.mjs tests/preflop-delivery.test.mjs tests/preflop-workflow.test.mjs tests/ranked-workflow.test.mjs tests/preflop-local-d1.test.mjs tests/reviewed-preflop-archive.test.mjs tests/detailed-reasons.test.mjs

      - name: Verify authoritative ranked service without live credentials
        working-directory: apps/backend
        run: node --experimental-strip-types --test tests/ranked.test.mjs

      - name: Verify continuous FastFold authentication, replay and atomic settlement
        working-directory: apps/backend
        run: npx --yes --package=wrangler@4.147.0 --call 'node scripts/verify-fastfold-local-runtime.mjs --wrangler "$(command -v wrangler)"'

      - name: Verify local D1 roundtrip, idempotency, isolation and failed-import rollback
        run: node scripts/verify-preflop-local-d1.mjs --sql .local/reviewed-preflop/preflop.sql --manifest .local/reviewed-preflop/delivery.json

      - name: Typecheck and build compatible client
        run: |
          npm run typecheck
          npm run build
          npm run test:sites

      # Every reachable HU spot must have a fresh flop+turn/river policy and report in git
      # (scripts/data/postflop-ai/policies); generated profile pairs are validated
      # from scripts/data/postflop-ai/profiles too. No provider runs in CI.
      # Spot/profile-scoped SQL preserves every unmentioned history and profile.
      - name: Check postflop policy delivery
        run: node scripts/publish-d1.mjs --only postflop --require-all --out .local/postflop.sql

      - name: Retain exact validated delivery SQL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # One name per commit (overwritten on re-runs) so "re-run failed jobs" finds it.
          name: reviewed-preflop-${{ github.sha }}
          overwrite: true
          path: |
            apps/frontend/.local/reviewed-preflop/preflop.sql
            apps/frontend/.local/reviewed-preflop/delivery.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy authoritative ranked API, compatible client and reviewed preflop data
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/frontend
    steps:
      - name: Validate deployment secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Required repository secret $secret is missing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Same exact saved-source verification as the verify job.
          persist-credentials: false
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore exact reviewed Git LFS payload
        run: |
          node scripts/restore-reviewed-preflop.mjs
          node scripts/restore-reviewed-stage3.mjs

      - name: Fetch this run's validated delivery SQL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-preflop-${{ github.sha }}
          path: apps/frontend/.local/reviewed-preflop

      - name: Recheck delivery against this exact checkout
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: node scripts/verify-reviewed-preflop.mjs --check-bundle --out .local/reviewed-preflop

      # Add only accepted immutable MW3 hashes. Verify all current rows before
      # the first write and all headers/parts before either runtime is activated.
      - name: Import exact reviewed MW3 data and require full D1 readback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=2048
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/mw3-production-delivery.mjs import

      # Execute only the reviewed additive ranked schema, never all pending
      # account/postflop migrations. Re-running a main deployment is safe.
      - name: Apply exact ranked schema
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.147.0 d1 execute reysonai --remote --config wrangler.jsonc --file migrations/0009_ranked.sql --yes

      # Additive only: never run all pending account/postflop migrations.
      - name: Apply exact FastFold schema
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.147.0 d1 execute reysonai --remote --config wrangler.jsonc --file migrations/0010_fastfold.sql --yes

      # Independent human season: apply only this reviewed additive schema.
      - name: Apply exact six-human ranked schema
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.147.0 d1 execute reysonai --remote --config wrangler.jsonc --file migrations/0011_human_ranked.sql --yes

      # Additive profile storage only; never apply all pending migrations.
      - name: Apply exact postflop profile schema
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.147.0 d1 execute reysonai --remote --config wrangler.jsonc --file migrations/0012_postflop_profile_policies.sql --yes

      - name: Deploy ranked API before enabling the client
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.147.0 deploy --config wrangler.jsonc | tee ../frontend/.local/ranked-api-deployment.log
          node --input-type=module -e "import { readFileSync } from 'node:fs'; if (!/Current Version ID:\\s*[0-9a-f-]{36}/i.test(readFileSync('../frontend/.local/ranked-api-deployment.log', 'utf8'))) throw new Error('No positive ranked API deployment confirmation; do not enable client');"

      - name: Require live authoritative ranked readiness
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://app.reysonai.com';
          const assertCors = response => {
            if (response.headers.get('access-control-allow-origin') !== origin ||
                response.headers.get('access-control-allow-credentials') !== 'true') {
              throw new Error('Ranked cookie CORS is not ready for the production browser');
            }
          };
          const response = await fetch('https://api.reysonai.com/v1/ranked/status', {
            headers: { Accept: 'application/json', Origin: origin },
            signal: AbortSignal.timeout(15000),
          });
          assertCors(response);
          if (!response.ok || (await response.json()).enabled !== true) {
            throw new Error('Ranked API/schema/published data are not ready; do not enable client');
          }
          const humanResponse = await fetch('https://api.reysonai.com/v1/fastfold/human/status', {
            headers: { Accept: 'application/json', Origin: origin },
            signal: AbortSignal.timeout(15000),
          });
          assertCors(humanResponse);
          const human = await humanResponse.json();
          if (!humanResponse.ok || human.enabled !== true || human.season !== 'human-fastfold-v1' ||
              human.mode !== 'six_verified_humans' || human.requiredHumans !== 6 ||
              human.comparisonMode !== 'shadow' || human.appliedPenalty !== false) {
            throw new Error('Six-human API/schema is not ready; do not enable compatible client');
          }
          const preflight = await fetch('https://api.reysonai.com/v1/ranked/matches', {
            method: 'OPTIONS',
            headers: { Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'content-type' },
            signal: AbortSignal.timeout(15000),
          });
          assertCors(preflight);
          if (preflight.status !== 204 || !preflight.headers.get('access-control-allow-methods')?.includes('POST') ||
              !preflight.headers.get('access-control-allow-headers')?.includes('content-type')) {
            throw new Error('Ranked browser POST preflight failed');
          }
          const anonymous = await fetch('https://api.reysonai.com/v1/ranked/profile', {
            headers: { Origin: origin },
            signal: AbortSignal.timeout(15000),
          });
          assertCors(anonymous);
          if (anonymous.status !== 401 || (await anonymous.json()).error !== 'sign_in_required') {
            throw new Error('Ranked authentication boundary failed');
          }
          NODE

      - name: Require live FastFold API and compatible published data before client
        working-directory: apps/backend
        run: node --experimental-strip-types scripts/verify-fastfold-readiness.mjs --configured --predeploy-compatible

      - name: Build
        run: npm run build

      - name: Deploy Worker
        # npx's cache leaves reviewed package/lockfile bytes unchanged; the
        # Wrangler action installs into this package when Wrangler is absent.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.147.0 deploy --config wrangler.jsonc | tee .local/client-deployment.log
          node --input-type=module -e "import { readFileSync } from 'node:fs'; if (!/Current Version ID:\\s*[0-9a-f-]{36}/i.test(readFileSync('.local/client-deployment.log', 'utf8'))) throw new Error('No positive Worker deployment confirmation; do not publish data');"

      # The new client reads both old and compact reason formats. Deploy it
      # before importing compact data. A failed import keeps the old D1 data.
      # One file contains ONLY 0003's idempotent schema + the preflop snapshot;
      # never invoke bare publish:d1, migrations apply, or whole-DB rollback.
      - name: Import reviewed preflop snapshot into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_OPTIONS: --max-old-space-size=2048
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/import-reviewed-preflop.mjs --remote

      # The exact source-identity gate runs after importing the reviewed snapshot.
      # The new client has already passed compatible-data integrity checks and
      # supports both previous and compact reason formats.
      - name: Require live FastFold release gate after reviewed import
        working-directory: apps/backend
        run: node --experimental-strip-types scripts/verify-fastfold-readiness.mjs --configured

      # Tracked postflop policies depend on the exact reviewed preflop snapshot.
      # Publish only after its import and strict source-identity gate succeed.
      - name: Publish postflop policies into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/publish-d1.mjs --only postflop --require-all --out .local/postflop.sql --execute remote

      # Final consumer acceptance uses the newly published preflop inputs, all
      # 32 pinned HTTP manifests and every part; transport availability alone
      # does not establish that the browser's source identity is compatible.
      - name: Require live MW3 payloads and actual consumer source identities
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: node scripts/mw3-production-delivery.mjs live

      - name: Retain MW3 delivery plan, recovery reference and exact outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mw3-delivery-outcome-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/frontend/.local/mw3-production/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

      - name: Retain preflop recovery reference and import outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflop-delivery-outcome-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/frontend/.local/reviewed-preflop/before-import-bookmark.json
            apps/frontend/.local/reviewed-preflop/import-outcome.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
