name: Verify account authentication
on:
  pull_request:
    branches: [development, main, codex/fix/pr44_frozen_loading/01a11189]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/verify-native-accounts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
      - name: Check Worker imports and Web/native authentication without live credentials
        run: |
          npm run check
          npm run test:account
          npm run test:account-local
          npm run test:account-native
