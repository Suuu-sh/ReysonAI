name: Verify FastFold ranked core
on:
  pull_request:
    branches: [development, main, codex/fix/pr44_frozen_loading/01a11189]
    paths:
      - 'apps/backend/**'
      - 'apps/shared/**'
      - 'apps/mcp/src/**'
      - 'apps/mcp/package.json'
      - 'apps/mcp/package-lock.json'
      - 'apps/frontend/src/agent/**'
      - 'apps/frontend/src/trainer/**'
      - 'apps/frontend/src/account/**'
      - 'apps/frontend/src/components/**'
      - 'apps/frontend/src/estimated/**'
      - 'apps/frontend/src/locale.ts'
      - 'apps/frontend/src/i18n.ts'
      - 'apps/frontend/src/route.ts'
      - 'apps/frontend/scripts/postflop-ai/**'
      - 'apps/frontend/scripts/lib/**'
      - 'apps/frontend/scripts/restore-reviewed-preflop.ts'
      - 'apps/frontend/scripts/data/postflop-ai-pilot.json'
      - 'artifacts/preflop/stage2-reviewed.tar.gz'
      - 'apps/frontend/tests/human-ranked-ui.test.ts'
      - 'apps/frontend/tests/poker-table-ui.test.ts'
      - 'apps/frontend/tests/fastfold-ui.test.ts'
      - 'apps/frontend/tests/fastfold-app-integration.test.ts'
      - 'apps/frontend/tests/ranked-ui.test.ts'
      - 'apps/frontend/tests/trainer-release-status.test.ts'
      - 'apps/frontend/tests/ranked-workflow.test.ts'
      - 'apps/frontend/package.json'
      - 'apps/frontend/package-lock.json'
      - 'configs/**'
      - '.github/workflows/verify-fastfold.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install locked frontend test dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Install MCP runtime dependencies for the composed API Worker
        working-directory: apps/mcp
        run: npm ci --ignore-scripts
      - name: Restore exact reviewed preflop fixtures for Agent bootstrap
        working-directory: apps/frontend
        run: node scripts/restore-reviewed-preflop.ts
      - name: Verify FastFold UI, readiness and ranked workflow
        working-directory: apps/frontend
        run: node --experimental-strip-types --test tests/human-ranked-ui.test.ts tests/poker-table-ui.test.ts tests/fastfold-ui.test.ts tests/fastfold-app-integration.test.ts tests/ranked-ui.test.ts tests/trainer-release-status.test.ts tests/ranked-workflow.test.ts
      - name: Verify authoritative FastFold replay and backend module
        working-directory: apps/backend
        run: |
          node --experimental-strip-types --test tests/ranked-history.test.ts
          npx --yes --package=wrangler@4.147.0 --call 'node scripts/verify-fastfold-local-runtime.ts --wrangler "$(command -v wrangler)"'
          npm run check
